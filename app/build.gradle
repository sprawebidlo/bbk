plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.tvhomeshell'
    compileSdk 34

    defaultConfig {
        applicationId "com.custom.tvhomeshell"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
