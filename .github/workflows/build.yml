name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repository tree
        run: |
          echo "=== root ==="
          ls -la
          echo "=== gradle files ==="
          find . -maxdepth 3 -name settings.gradle -o -maxdepth 3 -name build.gradle | head -20

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Assemble debug
        run: |
          if [ -f settings.gradle ]; then
            ROOT="."
          elif [ -f launcher-project/settings.gradle ]; then
            ROOT="launcher-project"
          else
            echo "::error::settings.gradle not found. Upload the project files (app folder, build.gradle, settings.gradle)."
            exit 1
          fi
          echo "Project root: $ROOT"
          gradle -p "$ROOT" :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
